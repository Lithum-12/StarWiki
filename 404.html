<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 星图百科</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/home.css">
<style>
.nf-wrap{min-height:100vh;display:grid;place-items:center;padding:48px 20px;position:relative;z-index:1}
.nf-box{width:100%;max-width:720px}
.nf-brand{display:flex;justify-content:center;margin-bottom:20px}
.nf-404{font-family:var(--serif);font-size:clamp(56px,10vw,96px);line-height:1.1;
  color:var(--title);font-weight:700;letter-spacing:.02em;margin:6px 0 4px}
.nf-404 b{color:var(--acc-red-t);font-weight:700}
.nf-path{font-family:var(--mono);font-size:12px;color:var(--mut);word-break:break-all;margin-top:6px}
.nf-card .term-body{min-height:0;padding:14px 18px 18px}
.nf-err{color:var(--acc-red-t)}
.nf-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.nf-foot{margin-top:18px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--mut)}
</style>
</head>
<body>
<div class="dots" aria-hidden="true"></div>

<main class="nf-wrap">
  <div class="nf-box">
    <a class="brand nf-brand" href="index.html">
      <span class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path class="star" d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2L12 2z"/>
          <circle class="spark" cx="19.5" cy="4.5" r="1.3"/>
        </svg>
      </span>
      <span><b>星图百科</b><small>LOCAL · MARKDOWN · WIKI</small></span>
    </a>

    <article class="card page nf-card">
      <div class="kicker"><span>ERROR · FILE NOT FOUND</span></div>
      <div class="nf-404">4<b>0</b>4</div>
      <h1 class="ptitle" style="font-size:clamp(22px,3vw,30px)">这一页不在星图上<span class="caret" aria-hidden="true"></span></h1>
      <p class="nf-path">请求路径：<span id="nfPath">…</span></p>

      <div class="terminal" aria-hidden="true">
        <div class="term-bar">
          <span class="term-dot r"></span><span class="term-dot y"></span><span class="term-dot g"></span>
          <span class="term-title">guest@starwiki: ~</span>
        </div>
        <div class="term-body">
          <div class="term-line cmd"><span class="tp">$</span> <span class="out" id="nfCmd">cat ./pages/null.html</span></div>
          <div class="term-line"><span class="tp">›</span> <span class="out nf-err">cat: No such file or directory —— 该条目未被收录</span></div>
          <div class="term-line"><span class="tp">›</span> <span class="out">试试返回首页，或从项目列表里挑一个条目。</span></div>
        </div>
      </div>

      <div class="nf-actions">
        <a class="btn" href="index.html">返回首页</a>
        <!--<button class="btn" onclick="history.back()">返回上一页</button>-->
      </div>
    </article>

    <div class="nf-foot">engine v1.4 · parser: local · 非商业用途</div>
  </div>
</main>

<script>
(function(){
  var p=decodeURIComponent(location.pathname).replace(/\/+$/,'');
  var parts=p.split('/').filter(Boolean);
  var tail=parts.length?parts.slice(-2).join('/'):'index.html';
  document.getElementById('nfPath').textContent='/'+tail;
  document.getElementById('nfCmd').textContent='cat ./'+tail;
})();
</script>
</body>
</html>

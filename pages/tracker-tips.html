> ⚠️ **兼容性警告**

## 简介

TrackerTips 是一个轻量级、可自定义的提示覆盖层（Overlay）模组，类似于原版的 Toast 通知。

[📥 获取项目与相关链接](#modal:tracker-tips-links)

当玩家满足特定条件时，屏幕上会弹出一个带有图标、标题和正文的提示框。提示框可停靠在屏幕的 8 个方位（包括快捷栏上方），并支持"避免与聊天栏重叠"选项。

支持**持久显示**（条件持续期间常驻，例如低血量警告）、**链式触发**（已显示的提示可继续监听下一个触发器，匹配后自动关闭或切换到下一个提示——非常适合制作引导教程序列），以及**主题**（颜色、边框、圆角、入场动画）。

您只需在 `config` 文件夹下编写 JSON 文件，或通过 Cloth Config API 进行编辑，即可轻松自定义文本、颜色甚至入场动画。

## 配置方式

您可以通过以下三种方式来配置本模组：

### 1. 指令 (Commands)
指令用于调整世界配置。

**无需 OP 权限：**
- `/trackertips about` – 显示模组信息

**需要 OP 权限：**
- `/trackertips reload` – 从世界中重新加载配置文件
- `/trackertips test <id>` – 强制测试某个提示
- `/trackertips list [global/saves]` – 列出全局/世界提示

### 2. 配置界面 (Config Screen)
按下 **F8**（未来可能会移除）或使用 Forge 的配置按钮打开 GUI。

您可以在此更改常规设置，或阅读模组的使用说明。如果安装了 Cloth Config API，您还可以微调每个提示的文本和主题文件。

### 3. 编辑 JSON 文件
**服务端配置文件**位于 `config/trackertips/` 目录下：
- `hints/` – 提示文本文件
- `themes/` – 提示主题文件

**客户端配置文件**：
- `config/trackertips-client.toml` – 客户端设置（覆盖层位置、宽度、淡入淡出等）
- `config/trackertips/global_config.json` – 全局属性

## 技术支持

### 触发器 (Triggers)
当前版本支持以下触发条件：

| 触发器 ID | 说明 |
| :--- | :--- |
| `game_time` | 一天内时间：在/之后/之前/区间内 |
| `first_join` | 首次加入世界（每位玩家仅一次） |
| `has_item` | 持有物品 |
| `item_obtained` | 获得物品 |
| `kill_entity` | 击杀实体 |
| `mine_block` | 挖掘方块 |
| `potion_added` / `potion_removed` / `potion_active` | 获得效果 / 效果消失 / 效果持续中（持久状态） |
| `advancement` | 获得进度 / 进度状态 |
| `dimension_change` | 切换维度 |
| `in_dimension` | 玩家所在维度 |
| `in_structure` | 玩家身处结构内（例如村庄；周期性检查） |

`triggers` 允许其他模组通过公共入口点（`Triggers.register`）注册新的触发器，并可以附带它们自己的语言和主题文件。此外，扩展模组还可以通过 `TTConfigManager.registerHintProvider` 编程注册提示定义、通过 `TTThemeManager.registerBuiltIn` 注册内置主题，无需用户手写 JSON 文件。

### 版本支持
目前仅支持 **Forge 1.20.1**。Fabric 和更多 Forge 版本正在计划中。

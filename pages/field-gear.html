<!DOCTYPE html>

<title>装备检查 · 星图百科</title>
<script>
/* 站点根：去掉文件名，条目页再退掉 pages 目录。资源必须运行时拼绝对地址——
   托管方（热铁盒）的服务端改写器按字面量拼相对路径，条目页在子目录里怎么写都会拼错 */
window.SITE_ROOT=location.href.split('#')[0].split('?')[0].replace(/\/[^/]*$/,'').replace(/\/pages$/,'');
document.write('<script src="'+window.SITE_ROOT+'/js/theme.js"><\/script>'+
  '<link rel="stylesheet" href="'+window.SITE_ROOT+'/css/style.css">');
</script>
</head>
<body data-page="field-gear">

<script type="text/markdown" id="page-md">
这是 **装备检查** 的子页面示例。

## 简介
出发前的装备检查清单，确保万无一失。

## 核心装备
- [x] 望远镜主镜与赤道仪/经纬仪
- [x] 目镜组（低倍寻星，高倍观测）
- [x] 红光头灯（保护暗适应）
- [ ] 防寒衣物与热饮

> 永远多带一块备用电池。
</script>

<script>document.write('<script src="'+window.SITE_ROOT+'/js/parser.js"><\/script>'+

  '<script src="'+window.SITE_ROOT+'/js/app.js"><\/script>');</script>
</body>

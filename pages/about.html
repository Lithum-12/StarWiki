## 解析器支持情况

| 语法 | 支持 | 备注 |
| --- | :-: | --- |
| 标题 / 段落 / 换行 | ✅ | 自动进入大纲 |
| 粗体、斜体、删除线、==高亮== | ✅ | 可嵌套 |
| 有序 / 无序 / 嵌套 / 任务列表 | ✅ | 缩进两格即嵌套 |
| 表格与对齐 | ✅ | 超宽表格可横向滚动 |
| 围栏代码块 | ✅ | 带语言标签与一键复制 |
| 引用 / 分隔线 / 图片 | ✅ | 相对路径图片自动定位 |
| `[[维基链接]]` | ✅ | 支持 `[[条目#锚点]]` |
| 脚注 `[^1]` | ✅ | 文末汇总，可回跳 |
| 原生 HTML 标签 | ⛔ | 出于安全一律转义 |


</script>

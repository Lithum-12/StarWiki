由 LithumC 精心打磨，这一页是 **N** 天的战果。
欢迎来到星图百科。这是一个纯静态、零依赖的 Wiki 引擎。

## 魔法链接演示

本站支持在 Markdown 正文中直接插入**弹窗触发器**。无需编写复杂的 HTML，只需使用普通的链接语法，将 `href` 指向 `#modal:自定义ID` 即可。

你可以点击下面的链接体验：

- [✦ 查看站点技术栈](#modal:site-info)
- [⌨ 查看快捷键一览](#modal:keys)
- [↗ 访问常去的外链](#modal:links)

## 解析器支持情况

| 语法 | 支持 | 备注 |
| --- | :-: | --- |
| 标题 / 段落 / 换行 | ✅ | 自动进入大纲 |
| 粗体、斜体、删除线、==高亮== | ✅ | 可嵌套 |
| 有序 / 无序 / 嵌套 / 任务列表 | ✅ | 缩进两格即嵌套 |
| 表格与对齐 | ✅ | 超宽表格可横向滚动 |
| 围栏代码块 | ✅ | 带语言标签与一键复制 |
| `[[维基链接]]` | ✅ | 支持 `[[条目#锚点]]` |
| 魔法弹窗链接 | ✅ | 使用 `[文字](#modal:id)` 触发 |
| 原生 HTML 标签 | ⛔ | 出于安全一律转义 |
</script>

<script src="/js/parser.js"></script>
<script src="/js/pages.js"></script>
<script src="/js/svgpack.js"></script>
<script src="/js/app.js"></script>
<script src="/js/modal.js"></script>

<script>
/* ── 魔法链接拦截与弹窗字典（本页独立闭环，无需修改 app.js） ── */
(function(){
  var host = document.getElementById('mdContent');
  if(!host || !window.WikiModal) return;

  /* 1. 拦截正文中的 #modal: 链接 */
  host.addEventListener('click', function(e){
    var a = e.target.closest('a');
    if(a){
      var href = a.getAttribute('href') || '';
      if(href.startsWith('#modal:')){
        e.preventDefault();
        var id = href.slice(7);
        if(window.ModalDict && window.ModalDict[id]){
          WikiModal.open(window.ModalDict[id]);
        }
      }
    }
  });

  /* 2. 外链图标 SVG */
  var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>';

  /* 3. 定义本页的弹窗字典 */
  window.ModalDict = {
    'site-info': {
      kicker: 'ABOUT · 星图百科',
      title: '关于这个小站',
      body:
        '<div class="key-row"><span>性质</span><span>个人项目，非商业用途</span></div>'+
        '<div class="key-row"><span>技术</span><span>原生代码渲染，无需依赖</span></div>'+
        '<div class="key-row"><span>解析</span><span>魔改 Markdown 解析器</span></div>'+
        '<div class="key-row"><span>版本</span><span>engine v4.11 · by lithumc</span></div>'
    },
    'keys': {
      kicker: 'HELP · KEYBOARD',
      title: '快捷键一览',
      body:
        '<div class="key-row"><span><kbd>/</kbd></span><span>聚焦搜索框</span></div>'+
        '<div class="key-row"><span><kbd>[</kbd></span><span>收起 / 展开侧栏</span></div>'+
        '<div class="key-row"><span><kbd>Esc</kbd></span><span>关闭弹窗 / 侧栏</span></div>'+
        '<div class="key-row"><span><kbd>?</kbd></span><span>打开快捷键弹窗</span></div>'
    },
    'links': {
      kicker: 'LINKS · 常去的站',
      title: '外链导航',
      body: (function(){
        var A = '<span class="arr">' + ARROW + '</span>';
        function card(name,href,desc,icon){
          return '<a class="m-link" href="'+href+'" target="_blank" rel="noopener">'+
            '<span class="m-ico"><img src="/img/icons/'+icon+'" alt="" onerror="this.style.display=\'none\'"></span>'+
            '<span class="m-body"><span class="m-t">'+name+'</span>'+
            '<span class="m-s">'+desc+'</span></span>'+A+'</a>';
        }
        return '<div class="modal-actions">'+
          card('NASA','https://www.nasa.gov','nasa.gov · 官方发布与影像','nasa.svg')+
          card('ESO','https://www.eso.org','eso.org · 欧洲南方天文台','eso.svg')+
          card('维基百科','https://zh.wikipedia.org','wikipedia.org · 词条考证','wikipedia.svg')+
          card('GitHub','https://github.com','github.com · 代码与备份','github.svg')+
        '</div>';
      })()
    }
  };
})();
</script>

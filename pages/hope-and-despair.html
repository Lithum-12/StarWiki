**这是一款基于经典玩法重制的硬核魔改生存整合包。你的目标就是活下去，撑过漫长的 100 天。**

[📥 获取整合包与相关链接](#modal:links)

## 核心生存机制

整合包难度较高，在原版惊变的基础上引入了极具挑战性的硬核机制：

### 1. 僵尸突变与进化
相比原版惊变，阶段更加紧张。僵尸将会更早发生**突变**。它们不再只是无脑的怪物，而是学会了**破坏以及放置方块，甚至是使用远程武器**。随着时间的推移，僵尸的智力和破坏力会越来越强，难度呈指数级上升。

### 2. 体温与环境系统
你必须时刻关注自己的**体温**（显示在物品栏上方）。
- **过冷或过热**：会导致玩家持续掉血。
- **空气稀薄区域**：当 Y 坐标 > 160 或处于岩浆附近时，会受到窒息伤害。务必准备好相应的防护装备或离开这些区域。

### 3. 精神状态与疲劳
整天不睡觉会使你倍感疲惫，精神状态不佳会严重影响你的生存能力。寻找安全的避难所睡觉来维持良好的作息。

## 维度封锁与求生

**无法进入下界和末地**。但这并不意味着你无法获取那里的资源。整合包添加了大量配方，你可以在主世界通过搜索和合成来获取原本存在于其他维度的稀有材料。

本包的设计初衷并非击败末影龙，而是**纯粹的求生**。

## 生存指南 (FAQ)

**Q: 我被僵尸感染了，怎么办？**
A: 普通的牛奶桶已经无法解毒。你需要合成特定的解药。[❐ 点击查看解药配方](#modal:antidote)

**Q: 游戏如何启动？**
A: 创建普通世界存档后，游戏会自动开始。如果没有触发，请在聊天栏点击 **[点这里]** 启动挑战。

**Q: 为什么我总是莫名其妙的死亡？**
A: 除了被僵尸咬死，最常见的原因是**体温异常**，或者误入了**空气稀薄区域**（Y>160）导致窒息。

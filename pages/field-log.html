/* 站点根：去掉文件名，条目页再退掉 pages 目录。资源必须运行时拼绝对地址——

</script>

## 简介
好记性不如烂笔头，现场手记是后期整理的重要素材。

## 日志模板

```text
日期：2025-XX-XX
地点：XXX
视宁度：III/V
透明度：4/5

观测记录：
20:00 - 目标A，细节描述...
21:30 - 目标B，细节描述...
建议在现场只记关键词，回家后再补充完整。

</script>

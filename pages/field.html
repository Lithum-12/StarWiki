一次成功的目视观测，八成工作发生在出发之前。

## 出发前 24 小时

1. 查月相：优先农历前后五天的无月夜
2. 查云量与视宁度预报，选定两个备选点位
3. 依据 [[深空天体目录]] 列出当晚目标，按升落时间排序
4. 给所有电池充满电

## 装备检查清单

- [x] 主镜、目镜（低倍 + 高倍各一）
- [x] 红光头灯
- [ ] 备用电池与充电宝
- [ ] 镜头布与气吹
- [ ] 打印星图或离线星图 App

## 观测日志

现场手记越简单越好，回家后再誊录。推荐格式：

```text
日期 2025-01-14  地点 西郊水库
月相 残月        视宁度 III/V  透明度 4/5

20:40  M42  25mm  云带轮廓清晰，四边形星可见 4+2 颗
21:15  M31  双筒  尘埃带隐约可辨
21:50  M45  裸眼  数出 9 颗主星
```

## 暗夜适应

人眼的暗适应完全建立约需 **20~30 分钟**，而一次手机亮屏就能让它前功尽弃。详见 [[术语表#暗适应]]。

> 经验法则：在红光下能勉强看清星图，就是合适的亮度。

从梅西耶星表中挑选了六个对 ==双筒镜== 与小口径望远镜最友好的目标，星等为目视参考值。

![猎户座大星云 · 目视速写](img/starfield.svg)

## 速查表

| 编号 | 名称 | 类型 | 视星等 | 星座 | 最佳月份 |
| --- | --- | --- | --: | --- | :-: |
| M31 | 仙女座星系 | 旋涡星系 | 3.4 | 仙女座 | 10 月 |
| M45 | 昴星团 | 疏散星团 | 1.6 | 金牛座 | 12 月 |
| M42 | 猎户座大星云 | 弥漫星云 | 4.0 | 猎户座 | 1 月 |
| M13 | 武仙座大球状星团 | 球状星团 | 5.8 | 武仙座 | 6 月 |
| M51 | 涡状星系 | 交互星系 | 8.4 | 猎犬座 | 4 月 |
| M57 | 环状星云 | 行星状星云 | 8.8 | 天琴座 | 7 月 |

## 观测建议

> 星等每相差 1 等，亮度相差约 **2.512 倍**。市区极限星等往往只有 3~4 等，建议优先选择上表中 ==视星等 ≤ 5== 的目标。

### 春季

- M51 与 M101：大视面星系，需要较暗的天空
- M13：北天最壮观的球状星团之一

### 夏季

- M57：高倍下呈明显的环状
- M27：比 M57 更亮的行星状星云

### 秋季

- M31：肉眼可见的最远天体（约 254 万光年）
- M33：面亮度低，务必避开月光

### 冬季

- M42：冬季星空的主角，流程参见 [[观测者手册]]
- M45：双筒镜中最璀璨的疏散星团

## 记录与延伸

观测后建议当场填一份观测日志，模板见 [[观测者手册#观测日志]]；不熟悉的名词可查 [[术语表]]。

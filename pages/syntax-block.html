<script>
/* 站点根：去掉文件名，条目页再退掉 pages 目录。资源必须运行时拼绝对地址——
   托管方（热铁盒）的服务端改写器按字面量拼相对路径，条目页在子目录里怎么写都会拼错 */
window.SITE_ROOT=location.href.split('#')[0].split('?')[0].replace(/\/[^/]*$/,'').replace(/\/pages$/,'');
document.write('<script src="'+window.SITE_ROOT+'/js/theme.js"><\/script>'+
  '<link rel="stylesheet" href="'+window.SITE_ROOT+'/css/style.css">');
</script>
</head>

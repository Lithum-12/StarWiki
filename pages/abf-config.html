自 23.8 更新后，Anything But Fish (ABF) 的可配置性进一步提高。虽然本质是一个随机钓鱼竿模组，但其强大的可配置性使其完全可以当作整合包魔改工具。

## 配置界面与文件位置

### GUI 配置界面 (推荐)

> **推荐新手使用 GUI**
> 如果你在客户端安装了下方模组，可以直接通过 **模组菜单** 打开图形化配置界面，这能显著降低上手难度。

若想通过直观的 GUI 修改配置，需要安装以下前置：
- [Fabric API](https://modrinth.com/mod/fabric-api) (23.8+ 版本为可选前置)
- [Mod Menu](https://modrinth.com/mod/modmenu)
- [YACL](https://modrinth.com/mod/yacl) (适用于 1.20+) 或 [Cloth Config API](https://modrinth.com/mod/cloth-config) (适用于 1.20-)

### 配置文件路径
配置文件位于 `.minecraft/config/anythingbutfish.json5`，首次启动时自动生成。
> **提示**：更新模组时，由于配置项可能发生变化，建议删除旧配置以防出现兼容问题。

## 核心机制：概率与产出

收杆时的产出由三个概率值控制，**三者总和不得超过 100**。剩余的部分即为“跑掉了”（什么也没钓到）的概率。

| 参数 | 默认值 | 说明 |
| --- | :-: | --- |
| `chanceItem` | 60 | 钓到随机物品的概率 (0~100) |
| `chanceEntity` | 25 | 钓到实体（生物）的概率。*小心点燃的 TNT 和苦力怕！* |
| `chanceXp` | 10 | 钓到经验球的概率 |

*若三项之和超过 100，模组会按比例自动缩放至 100 以内。*

## 核心机制：池模式 (黑/白名单)

模组支持两种池模式，分别由 `itemPoolIsWhitelist` 和 `entityPoolIsWhitelist` 控制：

- **白名单 (true)**：只有列表中的条目可以出现。列表为空则完全跳过该类战利品。
- **黑名单 (false)**：列表中的条目从全注册表中排除，其余均可出现（受注册表筛选器约束）。

## 物理参数

控制收杆后战利品飞向玩家的方式：
- **`flingSpeed`** (默认 0.1)：水平速度倍率。值越大，战利品飞向玩家的水平速度越快。
- **`flingArc`** (默认 0.08)：向上弧度倍率。值越大，战利品飞得越高。设为 0.0 时沿直线飞行。

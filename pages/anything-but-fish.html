**钓鱼竿充满了力量，你现在能钓上任何东西！**

Anything But Fish (ABF) 是一款彻底重构 Minecraft 钓鱼机制的 Fabric 模组。它打破了原版只能钓到鱼、垃圾和宝藏的限制，让钓鱼竿成为随机生存中最令人期待的“盲盒”工具。

[📥 获取模组与相关链接](#modal:abf-links)

## 核心特色

### 万物皆可钓
除了常规的鱼，你现在可以钓上：
- **其它物品**：矿物、装备、甚至其他模组添加的稀有物品。
- **生物**：你可能会把一只苦力怕或者末影人直接钓到脸上。
- **实体与经验**：直接获取经验球或特定的游戏实体。

### 高度可配置
模组拥有较高的自定义自由度。你可以精确控制每种战利品的权重、概率以及触发条件，打造最适合你整合包的钓鱼体验。

### 客户端 GUI 支持
模组**仅需在服务端安装**即可生效，但如果你同时安装在客户端，就可以使用 **GUI 配置界面**，更加轻松的实时调整参数。

## 运行环境与依赖

| 属性 | 说明 |
| --- | --- |
| **加载器** | Fabric & Forge |
| **安装位置** | 服务端必装，客户端可选 |
| **可选客户端 GUI 依赖** | [Fabric API](https://modrinth.com/mod/fabric-api) 与 [Mod Menu](https://modrinth.com/mod/modmenu)（仅 Fabric）, [YACL](https://modrinth.com/mod/yacl)（1.20+） 或 [Cloth Config API](https://modrinth.com/mod/cloth-config)（1.20-） |

## 版本支持

ABF 对于 Fabric 的兼容性较高，几乎覆盖了 Fabric 发展史上的所有主流版本，且支持部分 Forge 版本：

| 版本分支 | 支持的具体版本 | 备注 |
| --- | --- | --- |
| **mc-26.x** | 26.1 ~ 26.1.2 | 部分源码由 ZenanMiao 贡献 |
| **mc-1.21.11** | 1.21 ~ 1.21.11 | 暂不支持 1.21.4 |
| **mc-1.20.4** | 1.20.3 ~ 1.20.6 | 暂不支持 1.20 |
| **mc-1.20.1** | 1.20.1 ~ 1.20.1 | 暂不支持 1.20 |
| **mc-1.19.4** | 1.19 ~ 1.19.4 |  |
| **mc-1.18.2** | 1.18 ~ 1.18.2 |  |
| **mc-1.17.1** | 1.17 ~ 1.17.1 | 1.17.x 需要 Java 17 |
| **mc-1.16.5** | 1.15 ~ 1.16.5 | 1.15.x 无 GUI 配置界面 |
| **mc-1.20.1-forge** | 1.20 ~ 1.20.4 | Forge 版本 |

计划支持 NeoForge，完工时间待定。

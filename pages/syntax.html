## 标题层级

使用 1~6 个 # 号表示层级，其中二级与三级标题会自动进入右侧大纲。

## 行内样式

**粗体**、*斜体*、~~删除线~~、==荧光标记==，以及 `行内代码` 都可以自由组合，例如 ==**重点中的重点**==。

## 表格

支持对齐语法：`:-` 左对齐、`:-:` 居中、`-:` 右对齐。

| 语法 | 写法 | 使用频率 |
| :-- | :--: | --: |
| 粗体 | `**文字**` | 很高 |
| 高亮 | `==文字==` | 一般 |
| 脚注 | `[^1]` | 较低 |

## 代码块

```python
import math

def limit_mag(aperture_mm: float) -> float:
    """估算口径对应的极限星等"""
    return 2.7 + 5 * math.log10(aperture_mm)

print(limit_mag(150))  # 约 14.1 等
```

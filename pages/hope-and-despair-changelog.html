# Hope And Despair 更新日志

本页面记录了 Hope and Despair (惊变100天) 整合包的历史版本更新内容。你可以使用右侧的大纲快速跳转到特定版本。

## 19.4.159 (2026-07-14)

### 核心
- 初始渲染距离降低
- 更新 39 个模组
- 更新许可，详情请查看 LICENSE.md

### 机制
- 降低血月僵尸数量
- 降低僵尸寻路次数

### 视觉
- 补全缺失语言键翻译
- 调整粒子数量
- 为更多组件提供多语言显示
- 帕秋莉手册拥有更多条目

### 服务端
- 更新脚本，支持 Java 检测
- 脚本日志将输出在目录中
- 支持自动删除客户端配置文件
- Windows UAC 权限优化
- Linux SU 权限优化

---

## 19.3.142-Canary (2026-05-16)

### 核心
- 回退原版矿物刷新率，后续版本将重新考虑

### 美化
- 高级信息提示框（F3+H）默认将关闭

## 19.3.104 (2026-05-01)
*UI统一革命，统一视觉体验！*

### 核心
- 僵尸 AI 逻辑微调
- 升级多个模组，提升稳定性
- 从该版本开始提供原生服务端！可通过 Modrinth 附加文件下载

### 机制
- 新增确认退出按钮
- 僵尸死亡有小概率掉落骨头
- 背包整理重新添加回来
- 调整了部分自定义配方

### 美化
- 重制点击按钮音效，可选择是否使用
- UI 设计统一，更清爽的体验
- Wiki 转移到游戏内帕秋莉手册

### 核心
- 更换背包整理 Mod，防止吞物品

### 机制
- 更新 9 个 Mod
- 模组脚本文件将以更安全的模式加载

### 美化
- 部分关键更新现在将会提醒玩家

## 19.1.65 (2026-02-28)
*本次更新平衡了众多机制，修复更多的 Bug！*

### 核心
- 修复玩家创建世界掉入虚空的 Bug **（这次已彻底修复！）**
- 修复了玩家遭遇极大延迟的问题
- 为下一版本的任务线做准备
- 修改 Quark 默认行为

### 机制
- 创建新世界时玩家将获得初始物资
- 锁定游戏模式为困难
- 矿物刷新减少
- 经验修补弃用
- 支持 Mod 木板合成物品
- 警卫村民增强

### 美化
- 主界面全部使用文本框
- 主界面按钮美化
- 更改游戏内 UI 位置
- 区块淡入使用另一种方法实现

---

## 19.0.0 (2026-02-04)
*这是一次质变的更新！我们几乎重制了它，让它变得更加具有生存性！*

### 核心
- 优化了众多优化逻辑，性能相比以往版本大幅提升
- 修复了进入游戏持久掉入虚空的 Bug
- 修复了多个崩溃（袭击结束后崩溃，动态的树种子崩溃等）
- REI 替换为了 JEI 以保证兼容性
- 删除了多个 Mod 提升运行速度
- 除游戏内 Wiki 未完善，支持全语言本地化，欢迎提交 PR

### 机制
- 游戏将自动开始，不再需要点击
- 解药获得难度增加，削弱金苹果抗感染能力
- 僵尸刷新率降低，寻路次数更少
- 更换了全新的家具 Mod
- 现在在岩浆和高处将会缺氧
- 战术针剂制作成本大幅缩减
- 挤牛奶拥有了冷却
- 枪械重新引入耐久机制
- 新增的滑翔伞可能可以救你一命
- 下界合金的合成成本降低

### 美化
- 全新 UI 去除繁杂设计
- 体温将使用摄氏度显示
- 游戏内 Wiki 重写

### ⚠️ 需要注意
> **存档迁移警告**
> 因改动太大，**此版本不支持从旧存档迁移**！强行迁移必定导致存档损坏，我们建议你重新开一个世界游玩。
> 
> **城市生成移除**
> 此版本**删除了城市创建**，我们计划重制城市，未来版本会重新添加。
